[project]
name = "djirl"
version = "0.1.0"
description = "DJI Mini 3 obstacle-avoidance RL in a Gaussian-splat replica of the neighbourhood"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.4.1",
    "gsplat==1.5.3+pt24cu124",
    "numpy<2",
    "plyfile>=1.0",
    "diffusers==0.31.0",   # TAESD image encoder (madebyollin/taesd)
    "tensorboard>=2.17",
    "packaging",
    "ninja",
    "scipy",
    "safetensors<0.6",
    "huggingface-hub<0.30",
    "pillow",
    "websockets>=12",    # pilot server (src/djirl/pilot.py)
    "pycolmap==4.2.1",   # SfM for reconstruction (tools/sfm.py, tools/train_splat.py)
]

[project.scripts]
djirl = "djirl.cli:main"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "gsplat"
url = "https://docs.gsplat.studio/whl/pt24cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
gsplat = { index = "gsplat" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djirl"]
